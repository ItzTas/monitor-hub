version: "2"

linters:
  default: standard
  enable:
    - bodyclose
    - errorlint
    - gosec
    - noctx
  settings:
    staticcheck:
      checks:
        - all
        - -ST1000
  exclusions:
    rules:
      - path: (_test\.go$|[a-z]+test/)
        linters:
          - gosec
    paths:
      - sdk/pluginpb

version: "2"

linters:
  default: standard
  enable:
    - bodyclose
    - errorlint
    - gosec
    - noctx
  settings:
    staticcheck:
      checks:
        - all
        - -ST1000
  exclusions:
    rules:
      - path: (_test\.go$|[a-z]+test/)
        linters:
          - gosec
      - path: src/internal/supervisor/supervisor\.go
        text: G204
        linters:
          - gosec
      - path: (^|/)sdk-go/cmd/(plugin|consumer)-conformance/main\.go$|^src/cmd/plugin-conformance/main\.go$
        text: G204|G702
        linters:
          - gosec
      - path: (^|/)src/internal/imagegen/imagegen\.go$
        text: G204
        linters:
          - gosec
      - path: (^|/)src/internal/examples/rust\.go$
        text: G204
        linters:
          - gosec
    paths:
      - sdk-go/pluginpb
      - src/internal/db

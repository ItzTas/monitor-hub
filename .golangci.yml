version: "2"

linters:
  default: standard
  enable:
    - bodyclose
    - errorlint
    - gosec
    - noctx
  settings:
    staticcheck:
      checks:
        - all
        - -ST1000
  exclusions:
    rules:
      - path: (_test\.go$|[a-z]+test/)
        linters:
          - gosec
      - path: internal/supervisor/supervisor\.go
        text: G204
        linters:
          - gosec
      - path: (^|/)sdk/cmd/plugin-conformance/main\.go$|^cmd/plugin-conformance/main\.go$
        text: G204|G702
        linters:
          - gosec
    paths:
      - sdk/pluginpb
      - internal/db

version: "2"

linters:
  default: standard
  enable:
    - bodyclose
    - errorlint
    - gosec
    - noctx
  settings:
    staticcheck:
      checks:
        - all
        - -ST1000
  exclusions:
    rules:
      - path: (_test\.go$|[a-z]+test/)
        linters:
          - gosec
      - path: src/internal/supervisor/supervisor\.go
        text: G204
        linters:
          - gosec
      - path: (^|/)sdk-go/cmd/(monitor|consumer)-conformance/main\.go$
        text: G204|G702
        linters:
          - gosec
      - path: (^|/)src/internal/imagegen/imagegen\.go$
        text: G204
        linters:
          - gosec
      - path: (^|/)src/internal/examples/rust\.go$
        text: G204
        linters:
          - gosec
      # The session cookie is Secure only over HTTPS: the hub may serve plain HTTP on a local network.
      - path: (^|/)src/internal/api/gate/gate\.go$
        text: G124
        linters:
          - gosec
    paths:
      - sdk-go/monitorpb
      - src/internal/db

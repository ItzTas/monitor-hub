name: Docker

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    name: Check and test
    runs-on: ubuntu-24.04
    services:
      rabbitmq:
        image: rabbitmq:4-alpine
        env:
          RABBITMQ_DEFAULT_USER: monitor
          RABBITMQ_DEFAULT_PASS: monitor
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 5s
          --health-timeout 10s
          --health-retries 20
    env:
      CI: "true"
      TEST_AMQP_URL: amqp://monitor:monitor@localhost:5672/
      GOLANGCI_LINT_VERSION: v2.15.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            sdk/go.sum

      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@"${GOLANGCI_LINT_VERSION}"

      - name: Put the PostgreSQL binaries on PATH
        run: printf '%s\n' /usr/lib/postgresql/*/bin | sort -V | tail -n 1 >> "$GITHUB_PATH"

      - name: Install procps and the Python plugin example's runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends procps python3-venv
          python3 -m venv "$RUNNER_TEMP/example-python"
          "$RUNNER_TEMP/example-python/bin/pip" install "grpcio>=1.78.0" "protobuf>=6.31.1"
          echo "MONITOR_HUB_EXAMPLE_PYTHON=$RUNNER_TEMP/example-python/bin/python" >> "$GITHUB_ENV"

      - name: Install the Rust toolchain
        working-directory: sdk-rust
        run: rustup show active-toolchain || rustup toolchain install

      - name: Check and test the Go modules
        run: make check

      - name: Check and test the Rust SDK
        run: make check-rust

      - name: Check the generated Dockerfile
        run: go run ./cmd/imagegen -check

  image:
    name: Build and publish the image
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,priority=300

      - if: github.event_name == 'push'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

[package]
name = "monitor-hub-plugin"
version = "0.1.0"
edition.workspace = true

[features]
postgres = ["dep:tokio-postgres"]

[dependencies]
chrono = { workspace = true, features = ["now"] }
prost.workspace = true
prost-types.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["macros", "net", "signal", "sync", "time"] }
tokio-postgres = { workspace = true, optional = true }
tokio-stream = { workspace = true, features = ["net"] }
tonic = { workspace = true, features = ["codegen", "router", "server"] }
tonic-health.workspace = true
tonic-prost.workspace = true
tracing = { workspace = true, features = ["std"] }
tracing-subscriber = { workspace = true, features = ["registry", "std"] }

[dev-dependencies]
monitor-hub-plugin-testkit = { path = "../testkit" }
tempfile.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread"] }
tonic = { workspace = true, features = ["channel"] }

[[example]]
name = "migrate_fixture"
required-features = ["postgres"]

[[test]]
name = "migrate"
required-features = ["postgres"]

[package]
name = "monitor-hub-sdk"
version = "0.4.0"
edition.workspace = true
rust-version.workspace = true

[dependencies]
chrono = { workspace = true, features = ["now"] }
prost.workspace = true
prost-types.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["macros", "net", "rt", "signal", "sync", "time"] }
tokio-stream = { workspace = true, features = ["net"] }
tonic = { workspace = true, features = ["codegen", "router", "server"] }
tonic-health.workspace = true
tonic-prost.workspace = true
tracing = { workspace = true, features = ["std"] }
tracing-subscriber = { workspace = true, features = ["registry", "std"] }

[dev-dependencies]
monitor-hub-sdk-testkit = { path = "../testkit" }
tempfile.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "test-util"] }
tonic = { workspace = true, features = ["channel"] }

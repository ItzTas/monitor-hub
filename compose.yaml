x-arcane:
  urls:
    - http://hub.lan

services:
  monitor-hub:
    image: ghcr.io/itztas/monitor-hub:${MONITOR_HUB_TAG:-latest}
    container_name: monitor-hub
    cpus: "1.0"
    # Estimate, not a measurement: the hub, its monitor processes and, while the gazette monitor
    # reads PDFs, up to 320m of tmpfs plus pdftotext. Watch it with `docker stats`.
    mem_limit: 768m
    # Estimate. Threads count as pids; the hub, the monitors and pdftotext should need well under
    # this. The limit only stops a runaway fork.
    pids_limit: 256
    restart: unless-stopped
    read_only: true
    tmpfs:
      # Monitor sockets and the gazette monitor's PDF downloads. That monitor scans two editions at
      # once, each PDF up to 256 MiB; real editions are a few megabytes. 320m holds one PDF at the
      # limit, not two: two would take 512m of the 768m above and leave 256m for the hub, the
      # monitors and two pdftotext runs. Sockets need no exec, so this stays noexec.
      - /tmp:size=320m,mode=1777,noexec,nosuid,nodev
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    env_file: .env
    environment:
      TZ: ${TZ:-America/Boa_Vista}
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${APP_PORT:-8090}:8080"
    volumes:
      - data:/data
      # The SEI password as a file, for SEI__SEI_PASSWORD_FILE=/run/secrets/sei_password. The hub
      # runs as user 65532, which must be able to read the file on the host (docs/deploy.md,
      # "Secrets from files"). Mount any other _FILE secret the same way.
      # - ./secrets/sei_password:/run/secrets/sei_password:ro
    networks:
      - postgres
      # The SEI database, if it still lives in the sei-monitor stack's own Postgres: join that
      # stack's network too (named <folder>_default, see docs/deploy.md) and uncomment this and
      # the block below.
      # - <old-stack-network>
    labels:
      caddy: http://hub.lan
      caddy.reverse_proxy: 127.0.0.1:${APP_PORT:-8090}

volumes:
  data:

networks:
  postgres:
    external: true
  # <old-stack-network>:
  #   external: true
